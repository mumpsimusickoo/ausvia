{% extends "base.html" %}
{% from "_macros.html" import render_field %}
{% block title %}Set new password — AUSVIA{% endblock %}
{% block public_content %}
<section class="mx-auto max-w-sm px-4 py-16 md:px-0">
  <h1 class="text-2xl font-bold text-t1 mb-1">Set a new password</h1>
  <form method="post" class="rounded-xl border border-line bg-white shadow-sm p-6 mt-6">
    {{ form.hidden_tag() }}
    {{ render_field(form.password) }}
    {{ render_field(form.confirm_password) }}
    <button type="submit" class="w-full rounded-lg bg-brand px-4 py-2.5 text-sm font-semibold text-white hover:bg-brand-hover">
      Update password
    </button>
  </form>
</section>
{% endblock %}

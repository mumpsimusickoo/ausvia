<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Ausbildung Finder</title>
  <style>
    body { font-family: -apple-system, Arial, sans-serif; max-width: 800px; margin: 30px auto; padding: 0 16px; color: #1a1a1a; }
    h1 { font-size: 22px; }
    nav a { margin-right: 16px; color: #2563eb; text-decoration: none; font-weight: 600; }
    label { display: block; margin-top: 12px; font-weight: 600; font-size: 14px; }
    input[type=text], input[type=email], textarea { width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-family: inherit; }
    textarea { min-height: 300px; font-size: 14px; line-height: 1.5; }
    button { margin-top: 16px; background: #2563eb; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 14px; }
    button:hover { background: #1d4ed8; }
    .flash { background: #fef3c7; border: 1px solid #f59e0b; padding: 10px; border-radius: 6px; margin: 12px 0; }
    .card { border: 1px solid #e5e5e5; border-radius: 8px; padding: 14px; margin-bottom: 12px; }
    .muted { color: #666; font-size: 13px; }
  </style>
</head>
<body>
  <nav><a href="/">Profile & Setup</a><a href="/search">Search & Draft</a></nav>
  {% with messages = get_flashed_messages() %}
    {% if messages %}{% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}{% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</body>
</html>
